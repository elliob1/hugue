<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hugues &amp; Ella: Pixel Pickup</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14121c;--panel:#1d1830;--gold:#e9c46a;--ink:#f4efe0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Press Start 2P",ui-monospace,monospace;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
#g{position:relative;width:min(100vw,calc((100vh - 24px)*1.5385));aspect-ratio:320/208;container-type:inline-size;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;left:1.5cqw;top:1.5cqw;right:1.5cqw;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#hearts{display:flex;gap:.8cqw}#hearts svg{width:4cqw;height:3.4cqw}
#meter{display:flex;align-items:center;gap:.8cqw;font-size:1.5cqw}
#bar{width:16cqw;height:2.4cqw;border:.4cqw solid #000;background:#3a3040;outline:.3cqw solid var(--ink)}
#fill{height:100%;width:30%;background:#e63946;transition:width .5s}
#taf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff2a2a;font-size:5.4cqw;text-align:center;white-space:nowrap;text-shadow:.5cqw .5cqw 0 #000,-.3cqw 0 0 #000,0 -.3cqw 0 #000;transition:all .7s steps(7);pointer-events:none;z-index:5}
#taf.c{left:98%;top:97%;transform:translate(-100%,-100%);font-size:2.2cqw;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.4}}
#hint{position:absolute;left:50%;bottom:3cqw;transform:translateX(-50%);font-size:1.8cqw;background:#000a;padding:1cqw 1.6cqw;border:.3cqw solid var(--gold)}
#dlg{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;background:var(--panel);border:.5cqw solid var(--gold);padding:1.6cqw;font-size:1.9cqw;line-height:1.7;box-shadow:0 0 0 .5cqw #000}
#dlg b{color:var(--gold)}#dlg p{margin:.6cqw 0}.y{color:#8fc7ff}
#dlg button{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#2c2548;border:.3cqw solid #54488a;padding:.9cqw 1.2cqw;margin-top:.8cqw;cursor:pointer}
#dlg button:hover{background:#43387a;border-color:var(--gold)}
.up{color:#7dff8a}.dn{color:#ff6b6b}
#scr{position:absolute;inset:0;background:#0d0a18f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4cqw;gap:2.4cqw;z-index:9}
#scr h1{font-size:4.2cqw;color:var(--gold);margin:0;text-shadow:.4cqw .4cqw 0 #000}
#scr p{font-size:1.8cqw;line-height:1.9;margin:0;max-width:80cqw}
#scr .go{color:#7dff8a;animation:bl 1s steps(2) infinite}
#flash{position:absolute;inset:0;background:#f00;opacity:0;pointer-events:none;transition:opacity .5s}
#toast{position:absolute;left:50%;top:9cqw;transform:translateX(-50%);font-size:1.8cqw;background:#000c;border:.3cqw solid #9fd0e8;padding:1cqw 1.6cqw;z-index:7;white-space:nowrap}
#pot{position:absolute;left:1.5cqw;top:6.4cqw;display:flex;align-items:center;gap:.8cqw;pointer-events:none}#pot svg{width:2.4cqw;height:3.6cqw}#pot span{display:flex;gap:.4cqw}#pot i{width:1.2cqw;height:1.2cqw;background:#3a3040;border:.2cqw solid #000}#pot i.on{background:#9fd0e8}
#vom{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:90cqw;text-align:center;line-height:1.3;color:#ff2a2a;font-size:4.4cqw;text-shadow:.5cqw .5cqw 0 #000,-.3cqw 0 0 #000;z-index:6;pointer-events:none;animation:vs .15s steps(2) infinite}
@keyframes vs{50%{transform:translate(-49%,-51%)}}
@keyframes sh{0%{transform:translate(.5cqw,.3cqw)}50%{transform:translate(-.5cqw,-.2cqw)}100%{transform:translate(.3cqw,-.4cqw)}}
canvas.tipsy{filter:blur(1.3px)}canvas.shake{animation:sh .18s steps(2) infinite}
[hidden]{display:none!important}
</style></head><body>
<div id="g">
<canvas id="c"></canvas>
<div id="hud"><div id="hearts"></div><div id="meter"><span>ELLA</span><div id="bar"><div id="fill"></div></div></div></div>
<div id="taf" hidden>YOU NEED TO TAF</div>
<div id="hint" hidden>E / SPACE: TALK</div>
<div id="dlg" hidden></div>
<div id="flash"></div><div id="toast" hidden></div><div id="vom" hidden>HUGUES LOSES HIS LUNCH</div><div id="pot" hidden></div>
<div id="scr"></div>
</div>
<script>
const TS=16,W=40,H=26,VW=320,VH=208;
const cv=document.getElementById("c"),x=cv.getContext("2d",{willReadFrequently:true});cv.width=VW;cv.height=VH;
const $=id=>document.getElementById(id);
const r=(a,b,c,d,col)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),c,d)};
// ---- map ----
const map=Array.from({length:H},()=>Array(W).fill(1)),fl=Array.from({length:H},()=>Array(W).fill("h"));
const carve=(a,b,c,d,t)=>{for(let j=b;j<=d;j++)for(let i=a;i<=c;i++){map[j][i]=0;if(t)fl[j][i]=t}};
carve(1,11,38,14);carve(18,1,21,24);
carve(1,1,16,9,"w");carve(23,1,38,9,"c");carve(1,16,16,24,"k");carve(23,16,38,24,"s");
carve(8,10,9,10,"h");carve(29,10,30,10,"h");carve(8,15,9,15,"h");carve(29,15,30,15,"h");
const objs=[],occ=new Set();
const add=(t,i,j)=>{objs.push({t,i,j});occ.add(j*W+i)};
[2,4,12,14].forEach(i=>[3,4,6,7].forEach(j=>add("desk",i,j)));
for(let i=23;i<=38;i++)add("shelf",i,1);
[4,5,6,7].forEach(j=>{add("shelf",25,j);add("shelf",35,j)});
[3,4,12,13].forEach(i=>[18,22].forEach(j=>add("table",i,j)));
[[24,17],[37,17],[24,23],[37,23]].forEach(p=>add("dummy",...p));
add("target",25,20);add("target",36,20);
[[3,11],[36,14],[16,12],[23,13]].forEach(p=>add("plant",...p));
const rooms=[[8,5],[30,5],[8,20],[30,20]];
const solidT=(i,j)=>i<0||j<0||i>=W||j>=H||map[j][i]||occ.has(j*W+i);
const blocked=(px,py)=>[[-5,-5],[5,-5],[-5,0],[5,0]].some(([a,b])=>solidT(Math.floor((px+a)/TS),Math.floor((py+b)/TS)));
// ---- drawing ----
function tile(i,j,sx,sy){
 if(map[j][i]){
  if(j+1<H&&!map[j+1][i]){r(sx,sy,16,16,"#5b6688");const o=i%2?4:12;r(sx,sy+7,16,1,"#46506f");r(sx,sy+15,16,1,"#46506f");r(sx+o,sy,1,7,"#46506f");r(sx+16-o,sy+8,1,7,"#46506f");r(sx,sy,16,1,"#7c88ad")}
  else r(sx,sy,16,16,"#262b3d");return}
 const t=fl[j][i],h=(i*7+j*13)%5;
 if(t==="h"){r(sx,sy,16,16,"#b89a78");r(sx+15,sy,1,16,"#9c805f");r(sx,sy+15,16,1,"#9c805f");if(h==0)r(sx+4,sy+5,3,2,"#c7ab89")}
 else if(t==="w"){r(sx,sy,16,16,j%2?"#9a6a3c":"#8f6035");r(sx,sy+15,16,1,"#6e4624");r(sx+(j%2?4:11),sy,1,15,"#74492a")}
 else if(t==="c"){r(sx,sy,16,16,"#4a5a8a");if(h<2)r(sx+5,sy+6,2,2,"#5a6ca0");if((i+j)%7==0)r(sx+10,sy+3,2,2,"#3d4b78")}
 else if(t==="k"){r(sx,sy,16,16,(i+j)%2?"#d8c9a0":"#c4b184")}
 else{r(sx,sy,16,16,"#d9a95b");if(h==0)r(sx+5,sy+6,3,2,"#c8963f");if(h==1)r(sx+10,sy+11,2,2,"#e6bb72")}
}
const bk=["#e63946","#4a7fd0","#3d9a4a","#e9c46a","#9a5ad0"];
const O={
 desk:(a,b)=>{r(a+1,b+4,14,10,"#2a1a10");r(a+2,b+5,12,6,"#c08850");r(a+2,b+11,12,2,"#7a4e2a");r(a+5,b+6,5,3,"#f4efe0")},
 table:(a,b)=>{r(a,b+3,16,12,"#2a1a10");r(a+1,b+4,14,8,"#a8703c");r(a+1,b+12,14,2,"#6e4624");r(a+5,b+6,6,4,"#eee");r(a+7,b+7,3,2,"#e63946")},
 shelf:(a,b,i)=>{r(a,b,16,16,"#2a1a10");r(a+1,b+1,14,14,"#7a4e2a");for(let k=0;k<3;k++){r(a+1,b+5+k*5,14,1,"#4e3018");for(let n=0;n<5;n++)r(a+2+n*3,b+2+k*5,2,3,bk[(i+n+k)%5])}},
 dummy:(a,b)=>{r(a+7,b+9,2,6,"#5a3a20");r(a+4,b+13,8,3,"#7a4e2a");r(a,b+6,16,2,"#7a4e2a");r(a+3,b+5,10,6,"#2a1a10");r(a+4,b+6,8,4,"#cdb287");r(a+4,b,8,7,"#2a1a10");r(a+5,b+1,6,5,"#d9c39a")},
 target:(a,b)=>{r(a+3,b+12,2,4,"#5a3a20");r(a+11,b+12,2,4,"#5a3a20");r(a+2,b+1,12,12,"#2a1a10");r(a+3,b+2,10,10,"#f4efe0");r(a+4,b+3,8,8,"#d9482b");r(a+5,b+4,6,6,"#f4efe0");r(a+6,b+5,4,4,"#d9482b");r(a+7,b+6,2,2,"#f4efe0")},
 plant:(a,b)=>{r(a+4,b+10,8,6,"#8a4b2a");r(a+2,b+2,12,9,"#1f5f28");r(a+3,b+2,10,8,"#2e7d32");r(a+4,b+3,5,3,"#58a83c")}
};
const HP=["0110110","1111111","1111111","0111110","0011100","0001000"];
function heartSVG(on){let s="";HP.forEach((row,j)=>[...row].forEach((c,i)=>{if(c=="1")s+=`<rect x="${i}" y="${j}" width="1" height="1" fill="${on?(i<3&&j<2?"#ff8a92":"#e63946"):"#3a3040"}"/>`}));return`<svg viewBox="0 0 7 6" shape-rendering="crispEdges">${s}</svg>`}
function person(px,py,o,t){
 px=Math.round(px);py=Math.round(py);
 const bob=o.move?Math.floor(t/130)%2:0,w=o.fat?14:8,bx=px-w/2,bt=py-11-bob,ht=bt-8,L="#2a1a1a";
 r(px-6,py-1,12,3,"rgba(0,0,0,.28)");
 r(px-3,py-3-(bob?1:0),2,3,o.pants);r(px+1,py-3-(o.move&&!bob?1:0),2,3,o.pants);
 if(o.dress){r(bx-2,bt+5,w+4,5,L);r(bx-1,bt+6,w+2,3,o.shirt)}
 r(bx-1,bt-1,w+2,10,L);r(bx,bt,w,8,o.shirt);r(bx+Math.floor(w/2)-1,bt+4,2,2,o.belly);
 if(o.fat)r(bx+2,bt+3,w-4,4,o.belly);
 r(px-5,ht-1,10,9,L);r(px-4,ht,8,7,o.skin);
 r(px-5,ht-2,10,4,o.hair);r(px-5,ht,2,o.long?10:5,o.hair);r(px+3,ht,2,o.long?10:5,o.hair);
 if(o.spike){r(px-2,ht-4,4,2,o.hair);r(px+1,ht-3,4,2,o.hair)}
 r(px-2,ht+3,1,2,o.eye);r(px+1,ht+3,1,2,o.eye);
 if(o.long){r(px-3,ht+5,1,1,"#f09090");r(px+2,ht+5,1,1,"#f09090")}else r(px-1,ht+6,2,1,"#a0503c");
}
const HUG={fat:1,hair:"#d9531e",skin:"#f2b88c",shirt:"#3d6fd1",belly:"#5a8cea",pants:"#6e4624",eye:"#222",spike:1};
const ELLA={long:1,dress:1,hair:"#f2c94c",skin:"#f6cfa8",shirt:"#e8e8f4",belly:"#5a7fd0",pants:"#e8e8f4",eye:"#2e9e5b"};
// ---- lines ----
const LINES=[
["Are you a banana? Because I find you a-peeling.",8,"Ella giggles. Cheesy, but she’s smiling."],
["You must be poutine, because you make my heart melt.",14,"She laughs out loud. Poutine is sacred in Montréal!"],
["I’d give you my last fry. That’s true love.",18,"Ella’s eyes go soft. Nobody shares the last fry!"],
["If you were a pizza, I’d eat you in one bite.",-14,"Ella takes a big step back. Yikes."],
["You’re the maple syrup to my pancakes.",12,"Aww… Ella blushes."],
["Are you a donut? Because I’d put a ring on it.",5,"She rolls her eyes, but grins."],
["Do you like cheese? I’m feeling Gouda about us.",9,"A groan… followed by a laugh."],
["You’re hotter than the soup I burned my tongue on.",-6,"“Thanks… I think?” says Ella."],
["I eat 12 croissants a day, but you’re what I crave most.",6,"“Twelve?!” …She finds that kind of honest."],
["Wanna split a hot dog? I’ll take the bun.",-18,"Ella slaps her forehead. Hard no."],
["Are you a cookie? You’re one smart cookie, and sweet too.",10,"Ella tilts her head. That one worked."],
["Hey, you smell like gravy.",-10,"Ella sniffs her sleeve, horrified."],
["Eating alone is a bad idea. Lunch with me?",15,"“Okay, that was actually sweet,” she says."],
["My love for you is like my love for lunch: daily.",7,"She laughs. Can’t argue with that."]
];
// ---- state ----
let st="title",hearts=3,attr=30,tafT=0,cd=0,phase="",choices=[],cam={x:0,y:0},T=0;
const P={x:19*TS+8,y:12*TS+12,move:0},E={x:0,y:0};
const keys={};
function reset(){hearts=3;attr=30;tafT=0;P.x=19*TS+8;P.y=12*TS+12;const c=rooms[Math.floor(Math.random()*4)];E.x=c[0]*TS+8;E.y=c[1]*TS+12;
 $("taf").hidden=true;$("taf").classList.remove("c");$("dlg").hidden=true;$("scr").hidden=true;st="play";ui()}
function ui(){$("hearts").innerHTML=[0,1,2].map(i=>heartSVG(i<hearts)).join("");$("fill").style.width=attr+"%";$("fill").style.background=attr<30?"#8a4b9a":attr<70?"#e63946":"#ff6fa0"}
function screen(h,p,go){const s=$("scr");s.hidden=false;s.innerHTML=`<h1>${h}</h1><p>${p}</p><p class="go">${go||"PRESS ENTER"}</p>`}
function end(win,msg){st="end";$("dlg").hidden=true;$("hint").hidden=true;$("taf").hidden=true;
 screen(win?"SHE SAID YES!":"GAME OVER",msg,"PRESS ENTER TO PLAY AGAIN")}
function taf(){tafT=0;$("taf").hidden=true;$("taf").classList.remove("c")}
function openTalk(){st="talk";phase="pick";$("hint").hidden=true;
 const g=attr<20?"…What do you want?":attr<50?"Oh, hi Hugues.":attr<80?"Hey you! Back again?":"Hehe… hi, cutie.";
 choices=[...LINES].sort(()=>Math.random()-.5).slice(0,3);
 $("dlg").hidden=false;$("dlg").innerHTML=`<b>ELLA</b><p>${g}</p><p class="y">Hugues says…</p>`+choices.map((c,i)=>`<button data-i="${i}">${i+1}. ${c[0]}</button>`).join("")}
function pick(i){if(phase!=="pick"||!choices[i])return;const c=choices[i];phase="react";
 attr=Math.max(0,Math.min(100,attr+c[1]));ui();
 $("dlg").innerHTML=`<b>ELLA</b><p>${c[2]}</p><p class="${c[1]>0?"up":"dn"}">Attraction ${c[1]>0?"+":""}${c[1]}</p><button data-c="1">CONTINUE ▶</button>`}
function cont(){if(phase!=="react")return;$("dlg").hidden=true;cd=.6;
 if(attr>=100)return end(1,"Ella takes Hugues’ hand. Lunch is on him. Obviously.");
 if(attr<=0)return end(0,"Ella walks away without looking back. Hugues eats his feelings.");
 st="play"}
$("dlg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;b.dataset.c?cont():pick(+b.dataset.i)});
addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 keys[k]=1;
 if(k==="t"&&(st==="play"||st==="talk"))taf();
 if(st==="title"||st==="end"){if(k==="enter")reset();return}
 if(st==="talk"){if(phase==="pick"&&"123".includes(k)&&k)pick(+k-1);else if(["enter","e"," "].includes(k))cont();return}
 if(st==="play"&&["e"," ","enter"].includes(k)&&cd<=0&&Math.hypot(P.x-E.x,P.y-E.y)<26)openTalk()});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=0});
// ---- loop ----
function update(dt){
 if(cd>0)cd-=dt;
 if(st==="play"||st==="talk"){
  tafT+=dt;
  if(tafT>=90&&$("taf").hidden){$("taf").hidden=false;$("taf").classList.remove("c")}
  if(tafT>=95)$("taf").classList.add("c");
  if(tafT>=120){hearts--;tafT=0;ui();$("taf").hidden=true;$("taf").classList.remove("c");
   const f=$("flash");f.style.transition="none";f.style.opacity=.6;requestAnimationFrame(()=>{f.style.transition="opacity .6s";f.style.opacity=0});
   if(hearts<=0)return end(0,"Hugues forgot to taf too many times. Game over.")}
 }
 if(st!=="play")return;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 P.move=dx||dy?1:0;
 if(P.move){const n=Math.hypot(dx,dy),s=70*(hunger>0?1:.6)*(boost>0?1.5:1)*dt/n;const nx=P.x+dx*s,ny=P.y+dy*s;if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny}
 const near=Math.hypot(P.x-E.x,P.y-E.y)<26;$("hint").hidden=!near;
}
function draw(){
 cam.x=Math.max(0,Math.min(W*TS-VW,Math.round(P.x-VW/2)));cam.y=Math.max(0,Math.min(H*TS-VH,Math.round(P.y-VH/2)));
 r(0,0,VW,VH,"#14121c");
 const i0=Math.floor(cam.x/TS),j0=Math.floor(cam.y/TS);
 for(let j=j0;j<=j0+VH/TS+1&&j<H;j++)for(let i=i0;i<=i0+VW/TS+1&&i<W;i++)tile(i,j,i*TS-cam.x,j*TS-cam.y);
 const d=objs.map((o,n)=>({y:(o.j+1)*TS,f:()=>O[o.t](o.i*TS-cam.x,o.j*TS-cam.y,o.i+n)}));
 d.push({y:E.y,f:()=>{person(E.x-cam.x,E.y-cam.y+(Math.floor(T/500)%2?0:-1)*0,ELLA,T);
  if(Math.hypot(P.x-E.x,P.y-E.y)<26){const hx=Math.round(E.x-cam.x)-4,hy=Math.round(E.y-cam.y)-36;r(hx-1,hy-1,9,8,"#000");HP.forEach((row,j)=>[...row].forEach((c,i)=>{if(c=="1")r(hx+i,hy+j,1,1,"#ff6fa0")}))}}});
 d.push({y:P.y,f:()=>person(P.x-cam.x,P.y-cam.y,{...HUG,move:P.move},T)});
 d.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
}
// ===== v2: detail, potion, cloud, drunk effects =====
let hasPot=false,sips=0,sipT=0,puffs=[],decals=[],toastT=0,vomT=0;P.dir=1;
const POT={i:15,j:8};
[[1,9],[16,9],[23,9],[38,9],[1,16],[16,16]].forEach(p=>add("barrel",...p));
[[1,1],[16,1],[1,24],[16,24],[23,16],[38,16],[23,24],[38,24]].forEach(p=>add("crate",...p));
Object.assign(HUG,{hairL:"#ff8a3c",hairS:"#a83a12",skinS:"#e3a07a",shade:"#2c52a6",light:"#6b95ee",stripe:"#2c52a6",belly:"#e9c46a",pants:"#5a3a20",shoe:"#8a5a30",skin:"#f4bd94",eye:"#2a3a8a"});
